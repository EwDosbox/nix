set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term footclient
set $launcher fuzzel
set $menu nwg-drawer

corner_radius 4
blur enable
blur_xray off
blur_passes 4
blur_radius 8

shadows enable
shadows_on_csd off
shadow_blur_radius 8
shadow_color #0000007F

layer_effects "waybar" blur enable
shadows enable
corner_radius 10

default_dim_inactive 0.2
dim_inactive_colors.unfocused #000000FF
dim_inactive_colors.urgent #900000FF
scratchpad_minimize enable

gaps inner 2
gaps outer 2
default_border pixel 2
font pango:JetBrainsMono 10
smart_borders on
floating_modifier $mod normal

client.focused          #81a1c1 #434c5e #81a1c1 #81a1c1   #81a1c1
client.focused_inactive #88c0d0 #2e3440 #d8dee9 #4c566a   #4c566a
client.unfocused        #88c0d0 #2e3440 #d8dee9 #4c566a   #4c566a
client.urgent           #ebcb8b #ebcb8b #2e3440 #8fbcbb   #ebcb8b


input type:touchpad {
    dwt enabled
    tap enabled
}

input type:keyboard {
    xkb_numlock enabled
}

output DP-1 {
    mode 1920x1080@60Hz
    transform 270
    pos 0 0
}

output HDMI-A-1 {
    mode 1920x1080@60Hz
    pos 1080 840
}

for_window [class="Yad" instance="yad"] floating enable
for_window [app_id="yad"] floating enable
for_window [app_id="blueman-manager"] floating enable, resize set width 40 ppt height 30 ppt
for_window [app_id="pavucontrol"] floating enable, resize set width 50 ppt height 50 ppt
for_window [app_id="galculator"] floating enable, move position cursor
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [title="File Operation Progress"] floating enable, border pixel 1, sticky enable, resize set width 40 ppt height 30 ppt
for_window [title="Picture in picture"] floating enable, sticky enable
for_window [title="Save File"] floating enable
for_window [app_id="librewolf"] inhibit_idle fullscreen
for_window [app_id="Chromium"] inhibit_idle fullscreen


exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec mako
exec_always --no-startup-id foot --server
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store


workspace 1 output DP-1
workspace 2 output DP-1

workspace 3 output HDMI-A-1
workspace 4 output HDMI-A-1
workspace 5 output HDMI-A-1

bindsym {
    $mod+Return exec $term
    $mod+Backspace kill
    $mod+q kill
    $mod+d exec $launcher
    $mod+Shift+d exec $menu
    $mod+Shift+c reload
    $mod+f fullscreen
    $mod+space floating toggle
    $mod+v splitv
    $mod+Shift+v splith
    
    $mod+Left focus left
    $mod+Down focus down
    $mod+Up focus up
    $mod+Right focus right
    $mod+$left focus left
    $mod+$down focus down
    $mod+$up focus up
    $mod+$right focus right

    $mod+Shift+Left move left
    $mod+Shift+Down move down
    $mod+Shift+Up move up
    $mod+Shift+Right move right
    $mod+Shift+$left move left
    $mod+Shift+$down move down
    $mod+Shift+$up move up
    $mod+Shift+$right move right

    $mod+1 workspace number 1
    $mod+2 workspace number 2
    $mod+3 workspace number 3
    $mod+4 workspace number 4
    $mod+5 workspace number 5

    $mod+Shift+1 move container to workspace number 1
    $mod+Shift+2 move container to workspace number 2
    $mod+Shift+3 move container to workspace number 3
    $mod+Shift+4 move container to workspace number 4
    $mod+Shift+5 move container to workspace number 5

    XF86AudioRaiseVolume exec pamixer -ui 2
    XF86AudioLowerVolume exec pamixer -ud 2
    XF86AudioMute exec pamixer --toggle-mute
    XF86MonBrightnessUp exec brightnessctl -c backlight set +5%
    XF86MonBrightnessDown exec brightnessctl -c backlight set 5%-

    print exec grim -g "$(slurp)" - | swappy -f -
}

bar {
    swaybar_command waybar
}